name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run data-independent backend tests
        # Most of tests/ requires the real 1.5TB dataset (HAB_DATA_ROOT) or a
        # live, warmed server (@pytest.mark.api) -- neither exists in CI.
        # This runs only the tests that are self-contained (synthetic
        # fixtures / mocked routes). See tests/conftest.py and
        # tests/test_scaffold_ground_truth.py for the data-dependent side.
        run: |
          pytest tests/ -m "not api" \
            --ignore=tests/test_annotation_trees.py \
            --ignore=tests/test_egc_api_vs_jgi.py \
            --ignore=tests/test_jgi_file_parsing.py \
            --ignore=tests/test_mappings_notebook_matches.py \
            --ignore=tests/test_scaffold_ground_truth.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Unit / component tests
        run: npm test

      - name: Build
        run: npm run build
