[pytest]
# HAB Portal — pytest configuration
# Place this file at the root of your project (next to FastAPI/ and Frontend/).

# ── Discovery ─────────────────────────────────────────────────────────────────
testpaths     = tests
python_files  = test_*.py
python_classes= Test*
python_functions = test_*

# ── Output ────────────────────────────────────────────────────────────────────
# -v  : verbose (show each test name)
# -ra : show short summary for all non-passing tests at the end
addopts = -v -ra --tb=line

# ── Markers ───────────────────────────────────────────────────────────────────
markers =
    slow: marks tests as slow (run with -m slow to include)
    api: marks tests that require a live FastAPI server
    disk: marks tests that read directly from disk (no server needed)

# ── asyncio (if you add async tests later) ───────────────────────────────────
asyncio_mode = auto